services:
  db:
    image: postgres:17
    container_name: linya-db
    environment:
      POSTGRES_USER: linya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: linya
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linya -d linya"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: